<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survival Game</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    #survival-game {
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      height: 100vh;
      max-width: 100%;
    }

    #survival-game canvas {
      border-radius: 4px;
      display: block;
      width: min(100vw, calc(100vh * 16 / 9)) !important;
      height: min(100vh, calc(100vw * 9 / 16)) !important;
      max-width: 100%;
      max-height: 100vh;
      margin: 0 auto;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
    }

    #rotate-device {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 9999;
      padding: 24px;
      background: #111;
      color: #fff;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
    }

    .is-portrait #rotate-device {
      display: grid;
    }

    .is-portrait #survival-game {
      visibility: hidden;
    }
  </style>
</head>
<body>
<div id="survival-game"></div>
<div id="rotate-device" hidden>
  Xoay ngang điện thoại để chơi
</div>
</body>
</html>
