<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survival Game</title><style>* {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    #survival-game {
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      height: 100vh;
      max-width: 100%;
    }

    #survival-game canvas {
      border-radius: 4px;
      display: block;
      width: min(100vw, calc(100vh * 16 / 9)) !important;
      height: min(100vh, calc(100vw * 9 / 16)) !important;
      max-width: 100%;
      max-height: 100vh;
      margin: 0 auto;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
    }</style><script defer="defer" src="js/app.js"></script></head><body><div id="survival-game"></div></body></html>
